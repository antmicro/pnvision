[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"


[project]
name = "PnVision"
version = "0.0.0"
description = "OpenPnP visual inspection utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pyzbar",
    "Jinja2",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "ruff"
]

[project.scripts]
pnvision = "pnvision:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["PnVision"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "N", "B", "A", "RET"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
	"docs",
	"src/commands/__init__.py",
]

[tool.black]
line-length = 120

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true