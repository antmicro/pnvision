[build-system]
requires = ["setuptools>=83.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "PnVision"
dynamic = ["version"]
description = "OpenPnP visual inspection utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pyzbar",
    "Jinja2",
    "pandas",
    "typer",
]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "ruff",
]
docs = [
    "sphinx~=7.2.0",
    "antmicro-sphinx-utils @ https://github.com/antmicro/antmicro-sphinx-utils/archive/main.zip",
    "sphinx-inline-tabs",
    "sphinx-argparse==0.5.2",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "ruff"
]

[project.scripts]
pnvision = "pnvision.pnvision:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pnvision = [
    "collage_template/**/*",
    "template/**/*",
]

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["E", "F", "N", "B", "A", "RET"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
	"docs",
	"src/commands/__init__.py",
]

[tool.black]
target-version = ["py311"]
line-length = 120
force-exclude = '''
(
  docs/source/conf.py
)
'''

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = '^(build|dist|.*\.egg-info)/'
