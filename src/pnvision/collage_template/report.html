<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Inspection Collage</title>
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: hsla(210, 8%, 93%, 1);
            padding: 0;
            margin: 0;
            font-family: Inter, sans-serif;
        }

        div.header {
            background-color: hsla(210, 6%, 8%, 1);
            border-bottom: 1px solid hsla(210, 6%, 16%, 1);
            width: 100%;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            min-height: 65px;
            padding: 8px 0;
            box-sizing: border-box;
        }

        div.header_content {
            padding: 10px;
            padding-left: 1rem;
            line-height: 1.25;
            font-size: 0.875rem;
        }

        div.header_sep {
            padding: 0 4px;
            color: #94999e;
            font-size: 0.875rem;
        }

        table, p {
            width: 97%;
            margin-left: auto;
            margin-right: auto;
        }

        .table-wrapper {
            width: 97%;
            margin-left: auto;
            margin-right: auto;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 80vh;
            -webkit-overflow-scrolling: touch;
        }
        #report-table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #111315;
            color: #d6d9dc;
        }

        table {
            border: 1px solid hsla(210, 6%, 16%, 1);
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
        }

        thead th {
            background-color: hsla(210, 6%, 8%, 1);
            height: 36px;
            text-align: left;
            font-weight: 600;
            color: #94999e;
        }

        th, td {
            border: 1px solid hsla(210, 6%, 16%, 1);
            padding: 12px 16px;
            text-align: left;
        }

        td:nth-child(4), thead th:nth-child(4) {
            text-align: center;
        }

        tbody tr th[scope="row"] {
            background-color: transparent;
            font-weight: 500;
        }

        .part-name-cell {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .part-preview {
            width: 100px;
            height: auto;
            flex-shrink: 0;
            filter: invert(1);
        }

        @media (max-width: 600px) {
            .part-preview {
                width: 50px;
            }

            div.header_content,
            div.header_sep {
                font-size: 0.9rem;
            }

            th, td {
                padding: 8px 10px;
            }
        }

        .metadata-label {
            color: #94999e;
            font-weight: 400;
        }

        .step-model {
            font-family: 'Geist Mono', monospace;
            font-size: 0.85rem;
        }

        .board-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 24px 0;
        }

        .board-image {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            display: block;
        }

        .part-image {
            width: min(20vw, 320px);
            height: min(20vw, 320px);
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        .search-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        /* Search */
        .table-search {
            position: sticky;
            top: 0;
            z-index: 20;
            width: 97%;
            margin: 0 auto;
            padding: 12px 0;
            background-color: #000000;
        }

        .table-search input {
            box-sizing: border-box;
            width: 400px;
            max-width: 400px;
            padding: 8px 12px;
            height: 38px;
            background-color: hsla(210, 6%, 8%, 1);
            border: 1px solid hsla(210, 6%, 16%, 1);
            border-radius: 4px;
            color: #94999e;
            font: inherit;
            outline: none;
        }

        .table-search input::placeholder {
            color: #94999e;
            opacity: 0.7;
        }

        .table-search input:focus {
            border-color: #94999e;
        }

        .search-match {
            outline: 2px solid #94999e;
            outline-offset: -2px;
        }

        .search-no-match {
            color: #94999e;
        }

        /* Pagination */
        .pagination {
            width: 97%;
            margin: 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pagination button {
            background-color: transparent;
            border: 1px solid hsla(210, 6%, 16%, 1);
            color: #94999e;
            padding: 6px 10px;
            font: inherit;
            cursor: pointer;
        }

        .pagination button:hover {
            border-color: #94999e;
            color: #94999e;
        }

        .pagination button.active {
            background-color: hsla(210, 6%, 16%, 1);
            border-color: #94999e;
            color: #94999e;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .failed-checkbox,
        .failed-filter input,
        .dnp-filter input {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #94999e;
            background-color: transparent;
            cursor: pointer;
            position: relative;
            border-radius: 3px;
        }

        .failed-checkbox:hover,
        .failed-filter input:hover,
        .dnp-filter input:hover {
            border-color: #d6d9dc;
            box-shadow: 0 0 5px hsla(0, 0%, 80%, 0.35);
        }

        .failed-checkbox:checked,
        .failed-filter input:checked,
        .dnp-filter input:checked {
            background-color: hsla(210, 6%, 25%, 1);
            border-color: #d6d9dc;
        }

        .failed-checkbox:checked::after,
        .failed-filter input:checked::after,
        .dnp-filter input:checked::after {
            content: "✕";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -52%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            line-height: 1;
        }

        .failed-filter,
        .dnp-filter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            color: #d6d9dc;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }

        #export-report-button, #import-report-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 12px;
            margin-left: 10px;
            color: #d6d9dc;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
            appearance: none;
            background-color: transparent;
            border: 1px solid #94999e;
            border-radius: 3px;
        }

        #export-report-button:hover, #import-report-button:hover {
            border-color: #d6d9dc;
            color: #ffffff;
            box-shadow: 0 0 5px hsla(0, 0%, 80%, 0.2);
        }

    </style>
</head>

<div class="table-search">
    <div class="search-controls">
        <input
            type="search"
            id="table-search-input"
            placeholder="Search designator..."
            autocomplete="off"
            spellcheck="false"
        >

        <label class="dnp-filter">
            <input type="checkbox" id="dnp-only-toggle">
            <span>DNP only</span>
        </label>

        <label class="failed-filter">
            <input type="checkbox" id="failed-only-toggle">
            <span>Failed only</span>
        </label>

        <button type="button" id="export-report-button">
            Save
        </button>
        <button type="button" id="import-report-button">
            Import
        </button>
    </div>
</div>

<div class="pagination" id="pagination-top"></div>

<div class="table-wrapper">
    <table id="report-table">
        <thead>
            <tr>
                <th scope="col" style="text-align: center;">Designator</th>

                {% for serial_number in serial_numbers %}
                <th scope="col" style="text-align: center;">
                    {{ serial_number }}
                </th>
                {% endfor %}

                <th scope="col" style="text-align: center;">
                    FAILED?
                </th>
                <th scope="col" style="text-align: center;">
                    DNP status
                </th>
            </tr>
        </thead>

        <tbody id="report-body"></tbody>
    </table>
</div>

<div class="pagination" id="pagination-bottom"></div>

<script id="report-data" type="application/json">
{{ rows | tojson }}
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pageSize = {{ page_size }};
    const rows = JSON.parse(
        document.getElementById("report-data").textContent
    );
    const serialNumbers = {{ serial_numbers | tojson }};

    const tableBody = document.getElementById("report-body");
    const paginations = document.querySelectorAll(".pagination");
    const searchInput = document.getElementById("table-search-input");
    const dnpOnlyToggle = document.getElementById("dnp-only-toggle");
    const failedOnlyToggle = document.getElementById("failed-only-toggle");
    const exportReportButton = document.getElementById("export-report-button");
    const importReportButton = document.getElementById("import-report-button");

    let currentPage = 1;
    let currentSearch = "";

    function getFilteredRows() {
        return rows.filter(row => {
            const matchesSearch =
                !currentSearch ||
                String(row.designator)
                    .toLowerCase()
                    .includes(currentSearch);

            const matchesFailed =
                !failedOnlyToggle.checked ||
                row.failed === true;

            const matchesDnp =
                !dnpOnlyToggle.checked ||
                row.dnp === "DNP";

            return matchesSearch && matchesFailed && matchesDnp;
        });
    }

    function renderPage(page, matchIndex = -1) {
        const filteredRows = getFilteredRows();

        const pageCount = Math.max(
            1,
            Math.ceil(filteredRows.length / pageSize)
        );

        currentPage = Math.max(1, Math.min(page, pageCount));

        const start = (currentPage - 1) * pageSize;
        const visibleRows = filteredRows.slice(start, start + pageSize);

        tableBody.innerHTML = "";

        if (visibleRows.length === 0) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");

            td.colSpan = serialNumbers.length + 3;
            td.textContent = "No matching components found.";
            td.className = "search-no-match";

            tr.appendChild(td);
            tableBody.appendChild(tr);

            renderPagination();
            return;
        }

        visibleRows.forEach((row, index) => {
            const tr = document.createElement("tr");

            if (start + index === matchIndex) {
                tr.classList.add("search-match");
            }

            // Designator
            const designatorCell = document.createElement("td");
            designatorCell.textContent = row.designator;
            tr.appendChild(designatorCell);

            // Images
            serialNumbers.forEach(serialNumber => {
                const td = document.createElement("td");
                const filename = row.images[serialNumber];

                if (filename) {
                    const img = document.createElement("img");

                    img.src = `components/${filename}`;
                    img.alt = row.designator;
                    img.className = "part-image";
                    img.loading = "lazy";

                    td.appendChild(img);
                } else {
                    td.textContent = "-";
                }

                tr.appendChild(td);
            });

            // FAILED? checkbox
            const failedCell = document.createElement("td");
            failedCell.style.textAlign = "center";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "failed-checkbox";
            checkbox.checked = row.failed === true;

            checkbox.addEventListener("change", () => {
                row.failed = checkbox.checked;
            });

            failedCell.appendChild(checkbox);
            tr.appendChild(failedCell);

            // DNP
            const dnpCell = document.createElement("td");
            dnpCell.style.textAlign = "center";
            dnpCell.textContent = row.dnp || "";

            tr.appendChild(dnpCell);

            tableBody.appendChild(tr);
        });

        renderPagination();

        if (
            matchIndex >= start &&
            matchIndex < start + pageSize
        ) {
            const row = tableBody.children[matchIndex - start];

            if (row) {
                setTimeout(() => {
                    row.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });
                }, 0);
            }
        } else {
            window.scrollTo({
                top: 0,
                left: 0,
                behavior: "auto"
            });
        }
    }

    function renderPagination() {
        const filteredRows = getFilteredRows();

        const pageCount = Math.max(
            1,
            Math.ceil(filteredRows.length / pageSize)
        );

        paginations.forEach(pagination => {
            pagination.innerHTML = "";

            if (pageCount <= 1) {
                pagination.style.display = "none";
                return;
            }

            pagination.style.display = "flex";

            const previous = document.createElement("button");
            previous.type = "button";
            previous.textContent = "‹";
            previous.disabled = currentPage === 1;

            previous.onclick = () => {
                renderPage(currentPage - 1);
            };

            pagination.appendChild(previous);

            for (let page = 1; page <= pageCount; page++) {
                const button = document.createElement("button");

                button.type = "button";
                button.textContent = page;

                if (page === currentPage) {
                    button.classList.add("active");
                }

                button.onclick = () => {
                    renderPage(page);
                };

                pagination.appendChild(button);
            }

            const next = document.createElement("button");
            next.type = "button";
            next.textContent = "›";
            next.disabled = currentPage === pageCount;

            next.onclick = () => {
                renderPage(currentPage + 1);
            };

            pagination.appendChild(next);
        });
    }

    function searchTable(query) {
        currentSearch = query.trim().toLowerCase();

        const filteredRows = getFilteredRows();

        if (filteredRows.length === 0) {
            tableBody.innerHTML = "";

            const tr = document.createElement("tr");
            const td = document.createElement("td");

            td.colSpan = serialNumbers.length + 2;

            if (currentSearch && failedOnlyToggle.checked) {
                td.textContent = "No matching failed component found.";
            } else if (currentSearch && dnpOnlyToggle.checked) {
                td.textContent = "No matching DNP component found.";
            } else if (currentSearch) {
                td.textContent = "No matching designator found.";
            } else if (failedOnlyToggle.checked) {
                td.textContent = "No failed components.";
            } else if (dnpOnlyToggle.checked) {
                td.textContent = "No DNP components.";
            }

            td.className = "search-no-match";

            tr.appendChild(td);
            tableBody.appendChild(tr);

            renderPagination();
            return;
        }

        currentPage = 1;
        renderPage(currentPage, 0);
    }

    searchInput.addEventListener("input", () => {
        searchTable(searchInput.value);
    });

    failedOnlyToggle.addEventListener("change", () => {
        currentPage = 1;
        renderPage(1);
    });

    dnpOnlyToggle.addEventListener("change", () => {
        currentPage = 1;
        renderPage(1);
    });

    document.addEventListener("keydown", event => {
        if (
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "f"
        ) {
            event.preventDefault();
            searchInput.focus();
            searchInput.select();
        }
    });

    exportReportButton.addEventListener("click", () => {
        const reportState = rows
            .filter(row => row.failed === true)
            .map(row => ({
                designator: String(row.designator),
                failed: true
            }));

        const json = JSON.stringify(reportState, null, 2);

        const blob = new Blob([json], {
            type: "application/json;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "report-state.json";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);
    });

    importReportButton.addEventListener("click", () => {
        const fileInput = document.createElement("input");

        fileInput.type = "file";
        fileInput.accept = ".json,application/json";

        fileInput.addEventListener("change", event => {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = event => {
                try {
                    const importedData = JSON.parse(event.target.result);

                    if (!Array.isArray(importedData)) {
                        throw new Error("Invalid report JSON format.");
                    }

                    const failedDesignators = new Set(
                        importedData
                            .filter(item => item && item.failed === true)
                            .map(item => String(item.designator))
                    );

                    rows.forEach(row => {
                        row.failed = failedDesignators.has(
                            String(row.designator)
                        );
                    });

                    currentPage = 1;
                    renderPage(1);

                    alert("Report state imported successfully.");
                } catch (error) {
                    console.error("Failed to import report:", error);

                    alert(
                        "Failed to import report JSON.\n\n" +
                        error.message
                    );
                }
            };

            reader.readAsText(file);
        });

        fileInput.click();
    });

    renderPage(1);
});
</script>

</html>
